<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Rajdhani", system-ui, sans-serif;
        background: transparent;
      }
      /* Overlay-specific styles (scoped to body.overlay) */
      body.overlay {
        width: 280px;
        height: 280px;
        background: rgba(0, 8, 20, 0.85);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 180, 255, 0.3);
        border-radius: 12px;
        box-sizing: border-box;
        position: relative;
        color: #00d4ff;
      }
      #orb-wrap {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 180px;
        cursor: grab;
      }
      #orb-wrap:active {
        cursor: grabbing;
      }
      #orb-canvas {
        width: 180px;
        height: 180px;
        display: block;
      }
      #bar {
        position: absolute;
        bottom: 54px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00d4ff;
        box-shadow: 0 0 8px #00d4ff;
      }
      #mic {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid #00d4ff;
        background: rgba(0, 20, 50, 0.8);
        color: #00d4ff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 12px rgba(0, 180, 255, 0.3);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      #mic.listening {
        border-color: #00ff88;
        color: #00ff88;
        box-shadow: 0 0 18px rgba(0, 255, 136, 0.5);
      }
      #mic svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body class="overlay">
    <div id="orb-wrap" title="Drag to move · double-click to focus JARVIS">
      <canvas id="orb-canvas" width="180" height="180"></canvas>
    </div>
    <div id="bar"><span id="dot"></span><span id="label">Standby</span></div>
    <button id="mic" aria-label="Talk to JARVIS">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

      const STATE_COLORS = {
        standby: 0x00d4ff,
        listening: 0x00ff88,
        thinking: 0xb06bff,
        speaking: 0xffb347,
        offline: 0xff3333,
      };
      const STATE_LABELS = {
        standby: "Standby",
        listening: "Listening",
        thinking: "Processing",
        speaking: "Responding",
        offline: "Offline",
      };

      let state = "standby";
      const dot = document.getElementById("dot");
      const label = document.getElementById("label");

      function setState(s) {
        if (!STATE_COLORS[s]) return;
        state = s;
        const hex = "#" + STATE_COLORS[s].toString(16).padStart(6, "0");
        dot.style.background = hex;
        dot.style.boxShadow = `0 0 8px ${hex}`;
        label.textContent = STATE_LABELS[s];
        target.setHex(STATE_COLORS[s]);
      }

      // ---- Mini particle orb ----
      const canvas = document.getElementById("orb-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(180, 180, false);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
      camera.position.z = 3.4;

      const COUNT = 700;
      const positions = new Float32Array(COUNT * 3);
      const base = new Float32Array(COUNT * 3);
      const phase = new Float32Array(COUNT);
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < COUNT; i++) {
        const y = 1 - (i / (COUNT - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const th = golden * i;
        const x = Math.cos(th) * r, z = Math.sin(th) * r;
        base[i * 3] = x; base[i * 3 + 1] = y; base[i * 3 + 2] = z;
        positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
        phase[i] = Math.random() * Math.PI * 2;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.04, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);

      const cur = new THREE.Color(STATE_COLORS.standby);
      const target = new THREE.Color(STATE_COLORS.standby);
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        cur.lerp(target, 0.05);
        mat.color = cur;
        const breathe = 1 + Math.sin(t * 1.5) * 0.05;
        const chaos = state === "speaking" ? 0.18 : state === "listening" ? 0.1 : 0.05;
        const pos = geo.attributes.position.array;
        for (let i = 0; i < COUNT; i++) {
          const f = breathe + Math.sin(t * 2 + phase[i]) * chaos;
          pos[i * 3] = base[i * 3] * f;
          pos[i * 3 + 1] = base[i * 3 + 1] * f;
          pos[i * 3 + 2] = base[i * 3 + 2] * f;
        }
        geo.attributes.position.needsUpdate = true;
        points.rotation.y += 0.003;
        renderer.render(scene, camera);
      }
      animate();

      // ---- State sync from the main window ----
      let channel = null;
      try {
        channel = new BroadcastChannel("jarvis-state");
        channel.onmessage = (e) => {
          if (e.data && e.data.state) setState(e.data.state);
        };
      } catch {}

      // ---- Independent WebSocket + audio playback ----
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let ws = null;
      function connect() {
        try {
          ws = new WebSocket("ws://localhost:8000/ws");
        } catch {
          setTimeout(connect, 3000);
          return;
        }
        ws.onmessage = async (ev) => {
          let data;
          try { data = JSON.parse(ev.data); } catch { return; }
          if (data.type === "response") setState("speaking");
          if (data.type === "audio" && data.audio) {
            try {
              const bin = atob(data.audio);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              const buf = await audioCtx.decodeAudioData(bytes.buffer);
              const src = audioCtx.createBufferSource();
              src.buffer = buf;
              src.connect(audioCtx.destination);
              src.start();
            } catch {}
          }
          if (data.type === "audio_end") setState("standby");
        };
        ws.onclose = () => setTimeout(connect, 3000);
        ws.onerror = () => {};
      }
      connect();

      // ---- Independent mic (one-shot speech recognition) ----
      const micBtn = document.getElementById("mic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null;
      if (SR) {
        rec = new SR();
        rec.lang = "en-US";
        rec.interimResults = false;
        rec.onresult = (e) => {
          const text = e.results[e.results.length - 1][0].transcript.trim();
          if (text && ws && ws.readyState === 1) {
            setState("thinking");
            ws.send(JSON.stringify({ type: "message", content: text }));
          }
        };
        rec.onend = () => micBtn.classList.remove("listening");
      }
      micBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audioCtx.state === "suspended") audioCtx.resume();
        if (!rec) return;
        try {
          micBtn.classList.add("listening");
          setState("listening");
          rec.start();
        } catch {}
      });

      // ---- Drag the window by the orb area ----
      const wrap = document.getElementById("orb-wrap");
      let dragging = false, sx = 0, sy = 0;
      wrap.addEventListener("mousedown", (e) => {
        dragging = true;
        sx = e.screenX; sy = e.screenY;
        e.preventDefault();
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const dx = e.screenX - sx, dy = e.screenY - sy;
        sx = e.screenX; sy = e.screenY;
        try { window.moveBy(dx, dy); } catch {}
      });
      window.addEventListener("mouseup", () => { dragging = false; });

      // Double-click the orb -> focus the main JARVIS window.
      wrap.addEventListener("dblclick", () => {
        try { window.opener && window.opener.focus(); } catch {}
      });

      // Crude always-on-top: keep grabbing focus.
      setInterval(() => { try { window.focus(); } catch {} }, 2000);
    </script>
  </body>
</html>
